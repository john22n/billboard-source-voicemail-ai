# Compatible with Nginx 1.24.0; requires an existing Let's Encrypt certificate.
server {
    listen 80;
    listen [::]:80;
    server_name voicemail-agent.john22n-iii.com;

    return 308 https://voicemail-agent.john22n-iii.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voicemail-agent.john22n-iii.com;

    ssl_certificate /etc/letsencrypt/live/voicemail-agent.john22n-iii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voicemail-agent.john22n-iii.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/ws(?:/[A-Za-z0-9_-]+)?$ {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
