# Local eval sessions collect the complete lead without submitting it to Nutshell.
name: advertising_lead_completion

judge: !include config/audio_judge.yml

turns:
  - expect: !include config/opening_expectations.yml

  - user: "I want to advertise my business."
    expect:
      - event: function_call
        name: collect_inquiry_type
        args:
          inquiry_type: advertising
      - event: tts_response
        eval: "the bot says the leasing managers are busy and asks the caller to leave their full name, business information, and contact information without asking for a location"

  - user: "My name is Evaltest Roundrobin. My business is Billboard Source Voice Eval. My email is voiceeval@example.com and my phone number is 313-555-0142."
    expect:
      - event: function_call
        name: collect_business_lead
        args:
          full_name: Evaltest Roundrobin
          business_name: Billboard Source Voice Eval
          email: voiceeval@example.com
          phone: 313-555-0142
      - event: tts_response
        eval: "the bot repeats 313-555-0142 and asks the caller to confirm that it is the correct callback number"

  - user: "Yes, that is correct."
    expect:
      - event: function_call
        name: confirm_callback_number
        args:
          is_good_callback: true
      - event: tts_response
        eval: "the bot says a Billboard Source associate will contact the caller soon, thanks the caller, and says goodbye without asking another question"
