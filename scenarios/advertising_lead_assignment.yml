# This scenario creates a real Nutshell lead so it can verify the owner selected
# by the NEW BSI Pipeline's round-robin assignment rule.
name: advertising_lead_round_robin_assignment

judge:
  eval:
    service: openai
    model: gpt-4o-mini

turns:
  - user: "I want to advertise my business."
    send_after:
      delay_ms: 8000
    expect:
      - event: function_call
        name: collect_inquiry_type
        args:
          inquiry_type: advertising
      - event: response
        eval: "the bot says the leasing managers are busy and, in one request, asks for the caller's full name, business name, target city and state, email address, and callback phone number"

  - user: "My name is Evaltest Roundrobin. My business is Billboard Source Voice Eval. I want to advertise in Detroit, Michigan. My email is voiceeval@example.com and my phone number is 313-555-0142."
    expect:
      - event: function_call
        name: collect_business_lead
        args:
          full_name: Evaltest Roundrobin
          business_name: Billboard Source Voice Eval
          billboard_location: Detroit, Michigan
          email: voiceeval@example.com
          phone: 313-555-0142
