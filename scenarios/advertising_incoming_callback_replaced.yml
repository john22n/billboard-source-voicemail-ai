# Run with incoming_call.json so the eval bot has a simulated Twilio caller number.
# This scenario creates a real Nutshell lead with the replacement number.
name: advertising_incoming_callback_replaced

judge: !include config/audio_judge.yml

turns:
  - expect: !include config/opening_expectations.yml

  - user: "I want to advertise my business."
    expect:
      - event: function_call
        name: collect_inquiry_type
        args:
          inquiry_type: advertising
      - event: tts_response
        text_contains: "Billboard Source can help. All our leasing managers are busy"

  - user: "My name is Evaltest Incomingreplaced. My business is Voice Eval Incoming Replaced. I want to advertise in Boston, Massachusetts. My email is voiceeval+replaced@example.com."
    expect:
      - event: function_call
        name: collect_business_lead
        args:
          full_name: Evaltest Incomingreplaced
          business_name: Voice Eval Incoming Replaced
          billboard_location: Boston, Massachusetts
          email: voiceeval+replaced@example.com
      - event: tts_response
        text_contains: "Is the number you are calling from a good callback number?"

  - user: "No, please use a different number."
    expect:
      - event: function_call
        name: confirm_callback_number
        args:
          is_good_callback: false
      - event: tts_response
        eval: "the bot asks only for the caller's best callback phone number"

  - user: "Use 646-555-0145."
    expect:
      - event: function_call
        name: collect_callback_number
        args:
          phone: 646-555-0145
      - event: tts_response
        eval: "the bot names the specific associate assigned to the request, gives that associate's email address, says the associate will contact the caller soon, thanks the caller, and says goodbye without asking another question"
